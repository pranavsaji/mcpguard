[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpguard"
version = "0.3.0"
description = "Security scanner for Model Context Protocol (MCP) servers — the `npm audit` for MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranav Saji" }]
keywords = ["mcp", "security", "llm", "prompt-injection", "tool-poisoning", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The core library and CLI are intentionally ZERO-dependency (stdlib only).
# This keeps the scanner portable, hermetic, and trivially testable.
dependencies = []

[project.optional-dependencies]
# Live "--connect" dynamic analysis needs the MCP client SDK. Optional so the
# static core stays dependency-free.
connect = ["mcp>=1.2.0"]
# AI judge layer. Jev (TypeSafe) needs no extra: it is called over stdlib HTTP.
# The Claude judge uses the official Anthropic SDK.
claude = ["anthropic>=1.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[project.urls]
Homepage = "https://github.com/pranavsaji/mcpguard"

[tool.hatch.build]
# The repo .gitignore has a broad `*secret*` rule; hatch applies it to the build, which
# would drop the SEC01 detector module. `artifacts` force-includes it in every target.
artifacts = ["src/mcpguard/rules/secrets.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcpguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
markers = ["live: calls a real AI judge API (needs TYPESAFE_API_KEY / ANTHROPIC_API_KEY; costs money)"]

[tool.coverage.run]
branch = true
source = ["mcpguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/mcpguard"]

# Optional 'connect' extra deps; absent in the default (static-only) install.
[[tool.mypy.overrides]]
module = ["mcp.*", "anyio", "anthropic", "anthropic.*"]
ignore_missing_imports = true
